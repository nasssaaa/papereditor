# Include only inside the existing fblerp.com HTTPS server block.
location = /papereditor {
    return 308 /papereditor/;
}
location ^~ /papereditor/ {
    proxy_pass http://papereditor_mac/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $papereditor_connection;
    proxy_cookie_path / /papereditor/;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    client_max_body_size 80m;
    gzip on;
    gzip_types text/css text/javascript application/javascript application/json application/wasm image/svg+xml;
    gzip_min_length 1024;
    access_log C:/papereditor/access.log;
    error_log C:/papereditor/error.log;
}
